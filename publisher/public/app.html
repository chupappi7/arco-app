<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ARCO Publisher</title>
<style>
:root{--bg:#F4F4F5;--surface:#fff;--line:#E4E4E7;--line-2:#D4D4D8;--well:#FAFAFA;
  --text:#18181B;--muted:#52525B;--dim:#71717A;--accent:#0284C7;--ok:#15803D;--warn:#B45309;--bad:#B91C1C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 64px}
header{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;display:flex;align-items:center;gap:10px}
header img{width:28px;height:28px;border-radius:7px}
nav.tabs{display:flex;gap:6px;margin-left:auto}
nav.tabs a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap}
nav.tabs a.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.sec{padding:20px 22px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.cap{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=datetime-local],select,textarea{width:100%;background:var(--well);color:var(--text);
  border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;font:inherit}
textarea{min-height:90px;resize:vertical}
.count{font-size:12px;color:var(--dim);text-align:right}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line-2)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #FCA5A5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row{flex-wrap:wrap}.row .txt{flex:1 1 180px}.row .t{font-weight:600}.row .d{display:block;font-size:12.5px;color:var(--dim)}
.who{display:flex;align-items:center;gap:12px}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line-2)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.th{position:relative;width:84px}
.th img{width:84px;height:150px;object-fit:cover;border-radius:8px;border:2px solid transparent;display:block;background:var(--well)}
.th.cover img{border-color:var(--accent)}
.th .ctl{display:flex;justify-content:space-between;margin-top:4px}
.th .ctl button{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:0 6px;font-size:12px}
.th .badge{position:absolute;top:4px;left:4px;background:var(--accent);color:#fff;font-size:10px;border-radius:5px;padding:1px 5px}
.note{font-size:12.5px;color:var(--dim)}
.note.warn{color:var(--warn)}.note.bad{color:var(--bad)}
.status{padding:12px 14px;border-radius:9px;background:var(--well);border:1px solid var(--line);margin-top:12px}
.status.ok{border-color:#86EFAC;color:var(--ok);background:#F0FDF4}
.status.err{border-color:#FCA5A5;color:var(--bad);background:#FEF2F2}
.consent{font-size:12.5px;color:var(--muted);padding:14px 22px;background:var(--well);border-top:1px solid var(--line)}
.foot{padding:18px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px}
.day h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600}
.day.today h4{color:var(--accent)}
.pc{border:1px solid var(--line);border-radius:9px;padding:6px;margin-bottom:6px;font-size:12px;background:var(--well)}
.pc img{width:100%;height:64px;object-fit:cover;border-radius:6px}
.pill{display:inline-block;font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid var(--line-2)}
.pill.published{color:var(--ok);border-color:#86EFAC}.pill.failed{color:var(--bad);border-color:#FCA5A5}
.pill.publishing{color:var(--accent)}.pill.cancelled{color:var(--dim)}
.pc .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.pc .acts button,.pc .acts a{font-size:11px;border:0;background:none;color:var(--accent);padding:0}
button.link{border:0;background:none;color:var(--accent);padding:0;margin-left:auto;font-size:12.5px}
.pgroup{margin-bottom:14px}.pgroup:last-of-type{margin-bottom:4px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.acc{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;background:#fff;min-width:0}
.acc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#F0F9FF}
.acc.off{opacity:.6;cursor:not-allowed}
.acc .nm{display:flex;flex-direction:column;min-width:0}
.acc .nm b,.acc .nm .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line-2);flex:none}
.av.ini{display:inline-flex;align-items:center;justify-content:center;background:var(--well);color:var(--muted);font-weight:600;font-size:13px}
.who .av{width:40px;height:40px}
.acctrow{align-items:center}.acctrow .av{width:38px;height:38px}
.ttcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--well)}
.ttcard select{background:#fff}
.bulk{margin-bottom:12px}.bulk select{max-width:280px;display:block;margin-bottom:4px}
/* platform marks */
.pi{flex:none;vertical-align:-2px}
.pi.tiktok{fill:#000}.pi.instagram{fill:#E4405F}.pi.facebook{fill:#0866FF}
.chip .pi{margin-right:5px}.chip.on .pi{fill:#fff}
.pc .when{display:flex;align-items:center;gap:5px}
.phead .pi{margin-right:-2px}
.avw{position:relative;display:inline-flex;flex:none}
.badge-pl{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.badge-pl .pi{fill:#fff}
.badge-pl.tiktok{background:#000}.badge-pl.facebook{background:#0866FF}
.badge-pl.instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.btn.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff}
.btn.brand .pi{fill:#fff}
.btn.brand.tiktok{background:#000}.btn.brand.facebook{background:#0866FF}
.btn.brand.instagram{background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.brands{display:flex;flex-wrap:wrap;gap:8px}
/* Post to */
.chosen{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipacc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:3px 6px 3px 3px;background:#fff;font-size:13px}
.chipacc .av{width:24px;height:24px}.chipacc .badge-pl{width:13px;height:13px;right:-4px;bottom:-4px}
.chipacc .x{border:0;background:none;color:var(--dim);font-size:16px;line-height:1;padding:0 2px}
.chosen #openpick{margin-left:auto}
.pickpanel{margin-top:12px;border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--well);max-height:460px;overflow:auto}
.pickpanel #pq{margin-bottom:10px;background:#fff}
.bgroup{margin-bottom:10px}
.bhead{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.bhead .note{margin-left:auto}
.marks{display:inline-flex;gap:3px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 4px 7px 22px;cursor:pointer;border-radius:8px}
.prow:hover{background:#fff}.prow.off{opacity:.6;cursor:not-allowed}
.prow .nm{display:flex;flex-direction:column;min-width:0}
.prow .nm b,.prow .nm .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Accounts manager */
.newbrand{display:flex;gap:8px;flex-wrap:wrap}.newbrand input{flex:1 1 220px}
.brandcard .phead{flex-wrap:wrap}
.bacts{margin-left:auto;display:flex;gap:12px}.bacts .link{margin:0}
button.link.danger{color:var(--bad)}
select.move{width:auto;max-width:170px;padding:7px 10px}
details.hints{margin-top:12px}details.hints summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
details.hints p{margin:6px 0}
/* sign-in, workspace, people */
.signin{max-width:520px;margin:6vh auto 18px}
.limits{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-end;font-size:12px;color:var(--dim);margin-top:4px}
.lim{display:inline-flex;align-items:center;gap:4px}.lim.bad{color:var(--bad);font-weight:600}
.overrides{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.overrides .chip{display:inline-flex;align-items:center;gap:5px}
.ov{flex-basis:100%}.ov textarea{min-height:70px}
.draft .sec{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.draft img{width:64px;height:96px;object-fit:cover;border-radius:8px;flex:none}
.draft .dtxt{flex:1 1 220px;min-width:0}.draft .dtxt p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.draft .dacts{display:flex;gap:8px;align-items:center}
.loginform{display:flex;flex-direction:column;gap:10px}
.loginform input{font-size:16px}
#lc{letter-spacing:6px;font-size:22px;text-align:center}
.wsbar{display:flex;align-items:center;gap:10px;min-width:0}
.wsbar select{width:auto;max-width:220px;padding:6px 10px}
.invite{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.invite input[type=email]{flex:1 1 220px}.invite select{width:auto}
.scope{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding:6px 0}
.scope .bchk{color:var(--muted)}
.slotline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 8px}.slotline .link{margin:0}
.sloted{border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 10px;background:var(--well);display:flex;flex-direction:column;gap:10px}
.sloted .days,.sloted .times,.sloted .acts2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sloted .tm{display:inline-flex;align-items:center;gap:2px}.sloted input[type=time]{width:auto;padding:6px 8px;background:#fff}
.qplan{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13px}.seg button.on{background:var(--text);color:#fff}
.monthhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:11px;color:var(--dim);text-align:center;margin-bottom:4px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .day{min-height:92px;padding:6px}.month .day h4{margin:0 0 4px}.month .day.out{opacity:.45}
.day.drop{outline:2px dashed var(--accent);outline-offset:-2px}
[draggable=true]{cursor:grab}
.pill-post{display:flex;align-items:center;gap:4px;font-size:11px;border-radius:6px;padding:2px 5px;margin-bottom:3px;background:var(--well);border:1px solid var(--line)}
.pill-post.failed{border-color:#FCA5A5;color:var(--bad)}.pill-post.published{border-color:#86EFAC}
@media (max-width:760px){.week{grid-template-columns:1fr}.month{gap:3px}.month .day{min-height:64px;padding:3px}.pill-post span{display:none}.accts{grid-template-columns:1fr}
  nav.tabs{margin-left:0;gap:2px}nav.tabs a{padding:7px 9px}
  .phead{flex-wrap:wrap}.phead>.note{flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/" style="color:inherit;text-decoration:none;display:flex;gap:10px;align-items:center">
      <img src="/icon.png" alt="">ARCO Publisher</a></h1>
    <div class="wsbar" id="wsbar"></div>
    <nav class="tabs" id="tabs" hidden>
      <a href="#compose" data-v="compose">New post</a>
      <a href="#calendar" data-v="calendar">Calendar</a>
      <a href="#drafts" data-v="drafts">Drafts</a>
      <a href="#accounts" data-v="accounts">Accounts</a>
      <a href="#settings" data-v="settings">Settings</a>
    </nav>
  </header>
  <main id="app"><div class="card"><div class="sec">Loading…</div></div></main>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
