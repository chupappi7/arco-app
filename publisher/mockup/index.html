<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCO Publisher · redesign mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#1C2230; --canvas:#F2F4F6; --surface:#FFFFFF; --line:#DFE3E8; --line-2:#EBEEF2;
  --mute:#667085; --soft:#98A2B3; --saffron:#E9A23B; --saffron-tint:#FDF4E6;
  --danger:#C2410C; --danger-tint:#FEF1EB; --success:#15803D; --success-tint:#ECF7EF; --next-ink:#9A5B0B;
  --tt:#000; --ig:#E1306C; --fb:#0866FF;
  --r-panel:12px; --r-ctl:8px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --text:"Public Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --graphite:#E8ECF2; --canvas:#12161F; --surface:#1A1F2B; --line:#2A3140; --line-2:#222837;
  --mute:#9AA4B5; --soft:#6B7487; --saffron-tint:#3A2E1A; --danger-tint:#3A1F16; --success-tint:#16301F;
  --danger:#F28B5B; --success:#4ADE80; --next-ink:#F4C27A;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--graphite);font:14px/1.5 var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--graphite);display:grid;place-items:center}
.brand .logo i{width:12px;height:12px;border-radius:50%;background:var(--saffron);display:block}
.brand b{font:650 16px/1 var(--display);letter-spacing:-.01em}
.ws{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:var(--r-ctl);padding:8px 10px;margin-bottom:18px;text-align:left}
.ws .sq{width:24px;height:24px;border-radius:6px;background:#2F6F5E;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.ws span{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws small{display:block;color:var(--mute);font-weight:400;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-ctl);color:var(--mute);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--canvas);color:var(--graphite)}
.nav a.on{background:var(--graphite);color:var(--surface)}
.nav a .n{margin-left:auto;font-size:12px;min-width:20px;text-align:center;border-radius:10px;padding:0 6px;background:var(--canvas);color:var(--mute)}
.nav a.on .n{background:rgba(255,255,255,.16);color:var(--surface)}
.nav a .n.bad{background:var(--danger-tint);color:var(--danger)}
.create-side{margin:4px 0 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--saffron);color:#1C2230;border:0;border-radius:var(--r-ctl);padding:10px;font-weight:650}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line-2);margin-top:8px}
.me .av{width:30px;height:30px;border-radius:50%;background:#C7D2FE;color:#3730A3;display:grid;place-items:center;font-weight:700;font-size:12px}
.me div{font-size:13px;line-height:1.25}.me small{color:var(--mute)}

/* ---------- main ---------- */
.main{min-width:0;padding:28px 36px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.top h1{font:750 30px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.top p{margin:6px 0 0;color:var(--mute)}
.top p b{color:var(--graphite);font-weight:600}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-ctl);padding:9px 14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--graphite);color:var(--surface);border-color:var(--graphite)}
.btn svg{width:16px;height:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel)}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 6px}
.panel>header h2{font:650 16px/1.2 var(--display);margin:0}
.panel>header a{color:var(--mute);font-size:13px;text-decoration:none}
.panel>header a:hover{color:var(--graphite)}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px}
.ov .wide{grid-column:1/-1}
.rail{position:relative;padding:8px 18px 18px 18px}
.slot{display:grid;grid-template-columns:56px 18px 1fr;align-items:center;min-height:64px}
.slot time{font-weight:600;color:var(--mute);font-size:13px}
.slot .dot{position:relative;height:100%}
.slot .dot::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.slot .dot i{position:absolute;left:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--soft)}
.slot.done .dot i{background:var(--success);border-color:var(--success)}
.slot.failed .dot i{background:var(--danger);border-color:var(--danger)}
.slot.next .dot i{border-color:var(--saffron);background:var(--saffron);box-shadow:0 0 0 5px var(--saffron-tint)}
.post{display:flex;align-items:center;gap:12px;padding:8px 10px;margin-left:8px;border-radius:10px}
.post:hover{background:var(--canvas)}
.post img,.post .ph{width:40px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.post .who{flex:1;min-width:0}
.post .who b{display:flex;align-items:center;gap:6px;font-weight:600}
.post .who span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.status.pub{background:var(--success-tint);color:var(--success)}
.status.q{background:var(--canvas);color:var(--mute)}
.status.fail{background:var(--danger-tint);color:var(--danger)}
.status.next{background:var(--saffron-tint);color:var(--next-ink)}
.now{display:grid;grid-template-columns:56px 18px 1fr;align-items:center;height:22px}
.now time{font-weight:700;color:var(--saffron);font-size:12.5px}
.now .bar{grid-column:2/4;height:2px;background:var(--saffron);position:relative}
.now .bar::before{content:"";position:absolute;left:3px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--saffron)}
.pf{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.pf svg{width:9px;height:9px;fill:#fff}
.pf.tiktok{background:var(--tt)}.pf.instagram{background:radial-gradient(circle at 30% 110%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}.pf.facebook{background:var(--fb)}

.attn{padding:4px 10px 12px}
.attn a{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:10px;text-decoration:none;color:inherit}
.attn a:hover{background:var(--canvas)}
.attn .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.attn .ic svg{width:16px;height:16px}
.attn .ic.bad{background:var(--danger-tint);color:var(--danger)}
.attn .ic.warn{background:var(--saffron-tint);color:var(--next-ink)}
.attn .ic.mute{background:var(--canvas);color:var(--mute)}
.attn b{display:block;font-weight:600}.attn span{color:var(--mute);font-size:13px}
.attn em{margin-left:auto;font-style:normal;font-weight:600;font-size:13px;color:var(--graphite);border:1px solid var(--line);border-radius:7px;padding:4px 10px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:10px 18px 18px;align-items:end;height:150px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .stack{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;gap:2px}
.week .stack i{display:block;border-radius:3px}
.week .d span{font-size:12px;color:var(--mute)}
.week .d.today span{color:var(--next-ink);font-weight:700}
.legend{display:flex;gap:14px;padding:0 18px 16px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

.recent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:8px 18px 18px}
.rc{border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.rc .img{aspect-ratio:4/5;position:relative}
.rc .img .pf{position:absolute;top:8px;left:8px;width:20px;height:20px;border:2px solid #fff}
.rc .img .pf svg{width:10px;height:10px}
.rc div.meta{padding:9px 10px 10px;font-size:13px}
.rc .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .meta span{color:var(--mute)}
.rc .meta a{color:var(--graphite);font-weight:600;text-decoration:none;float:right}

/* ---------- performance ---------- */
.seg.sm button{padding:5px 10px;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin-top:10px}
.kpi{padding:14px 18px;border-right:1px solid var(--line-2);min-width:0}
.kpi:last-child{border-right:0}
.kpi span{display:block;color:var(--mute);font-size:13px}
.kpi b{display:block;font:700 24px/1.2 var(--display);letter-spacing:-.01em;margin:4px 0 2px}
.kpi em{font-style:normal;font-size:12px;font-weight:600}
em.up{color:var(--success)}em.down{color:var(--danger)}
.perfbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:24px;padding:16px 18px 18px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:180px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.stackv{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;gap:2px}
.stackv i{display:block;border-radius:3px}
.col span{font-size:12px;color:var(--mute)}.col.today span{color:var(--next-ink);font-weight:700}
.byacct{display:flex;flex-direction:column;gap:4px}
.ba{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.ba>span:not(.pf){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ba b{font-weight:700}.ba em{font-style:normal;font-size:12px;font-weight:600;width:44px;text-align:right}
.src{font-size:12px;color:var(--soft);margin:10px 0 0}
.tops{padding:4px 18px 14px}
.top-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.top-row:last-child{border-bottom:0}
.rank{width:20px;font:700 15px var(--display);color:var(--soft);text-align:center}
.top-row .ph{width:38px;height:46px;border-radius:6px;flex:none}
.top-row .who{flex:1;min-width:0}.top-row .who b{display:flex;align-items:center;gap:6px;font-weight:600}
.top-row .who span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:flex;gap:16px;color:var(--mute);font-size:13px}
.nums span{display:inline-flex;align-items:center;gap:5px;min-width:56px}
.nums span:first-child{color:var(--graphite);font-weight:600}
.rcstats{display:flex;gap:12px;margin-top:4px;color:var(--mute);font-size:12px}
.rcstats span{display:inline-flex;align-items:center;gap:4px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.perfbody{grid-template-columns:1fr}}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-bottom:1px solid var(--line-2)}.nums span:not(:first-child){display:none}}

/* ---------- create ---------- */
.cr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:18px;align-items:start}
.field{padding:16px 18px;border-bottom:1px solid var(--line-2)}
.field:last-child{border-bottom:0}
.field>label,.field>.lab{display:block;font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:30px;padding:4px 10px 4px 4px;background:var(--surface);font-size:13px;font-weight:500}
.chip .av{width:26px;height:26px;border-radius:50%;position:relative;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
.chip .av .pf{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border:2px solid var(--surface)}
.chip .av .pf svg{width:7px;height:7px}
.chip .x{color:var(--soft);border:0;background:none;padding:0 0 0 2px}
.chip.add{padding:6px 12px;border-style:dashed;color:var(--mute)}
.media{display:flex;gap:10px;flex-wrap:wrap}
.media .m{width:84px;height:105px;border-radius:9px;position:relative;overflow:hidden}
.media .m.cover{outline:2px solid var(--graphite);outline-offset:2px}
.media .m small{position:absolute;left:5px;top:5px;background:var(--graphite);color:var(--surface);font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px}
.media .add{width:84px;height:105px;border:1.5px dashed var(--line);border-radius:9px;display:grid;place-items:center;color:var(--mute);background:var(--canvas)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--graphite);border-color:var(--graphite)}
.tabs button .cust{width:6px;height:6px;border-radius:50%;background:var(--saffron)}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px;background:var(--surface);line-height:1.55}
.lims{display:flex;justify-content:flex-end;gap:16px;font-size:12px;color:var(--mute);margin-top:8px}
.lims span{display:inline-flex;align-items:center;gap:5px}
.fold{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;font-weight:600;text-align:left}
.fold small{color:var(--mute);font-weight:400}
.fold svg{width:16px;height:16px;margin-left:auto;color:var(--mute)}

.prev{position:sticky;top:24px}
.prev .tabs{padding:0 14px;margin:0}
.phone{margin:18px auto 20px;width:300px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface)}
.ig-head{display:flex;align-items:center;gap:9px;padding:10px 12px;font-weight:600;font-size:13px}
.ig-head .av{width:28px;height:28px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #d6249f}
.ig-img{aspect-ratio:4/5;position:relative}
.ig-img .pager{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px}
.ig-actions{display:flex;gap:14px;padding:10px 12px 4px}
.ig-actions svg{width:22px;height:22px}
.ig-dots{display:flex;justify-content:center;gap:4px;margin-top:-18px;margin-bottom:6px}
.ig-dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}.ig-dots i.on{background:var(--ig)}
.ig-cap{padding:2px 12px 14px;font-size:13px;line-height:1.45}
.ig-cap b{font-weight:600}
.ig-cap .more{color:var(--soft)}
.prev-note{font-size:12.5px;color:var(--mute);text-align:center;padding:0 18px 16px}

.dock{position:sticky;bottom:0;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);display:flex;align-items:center;gap:18px;padding:12px 14px;box-shadow:0 -6px 24px rgba(28,34,48,.06)}
.seg{display:inline-flex;background:var(--canvas);border-radius:9px;padding:3px}
.seg button{white-space:nowrap;border:0;background:none;border-radius:7px;padding:7px 12px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--graphite);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dock .when{color:var(--mute);font-size:13px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .when b{color:var(--graphite)}
.dock .sp{display:none}

/* ---------- library ---------- */
.lib{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:18px;align-items:start}
.libnav{padding:10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:24px}
.libnav button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--mute);font-weight:500;text-align:left}
.libnav button span{margin-left:auto;font-size:12px;color:var(--soft)}
.libnav button:hover{background:var(--canvas);color:var(--graphite)}
.libnav button.on{background:var(--canvas);color:var(--graphite);font-weight:600}
.libsep{font-size:12px;color:var(--soft);padding:12px 10px 4px}
.libnav .newf{color:var(--mute);margin-top:6px}
.libmain{padding:14px}
.libbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.srch{flex:1 1 200px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--mute)}
.srch input{border:0;outline:0;background:none;padding:8px 0;width:100%}
.libbar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--saffron-tint);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.selbar b{margin-right:6px}.selbar .link{margin-left:auto;border:0;background:none;color:var(--mute);font-weight:600}
.btn.danger{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{cursor:pointer;min-width:0}
.tile .thumb{aspect-ratio:4/5;border-radius:10px;position:relative;outline:2px solid transparent;outline-offset:2px}
.tile.open .thumb{outline-color:var(--line)}
.tile.sel .thumb{outline-color:var(--graphite)}
.tile .pick{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:6px;border:1.5px solid #fff;background:rgba(0,0,0,.18);color:#fff;display:grid;place-items:center;padding:0;opacity:0}
.tile:hover .pick,.tile.sel .pick,.tile .pick:focus-visible{opacity:1}
.tile.sel .pick{background:var(--graphite);border-color:var(--graphite)}
.tile .used{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);color:#1C2230;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px}
.fname{display:block;font-size:12.5px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);text-align:center;padding:10px;font-size:12px}
.drop b{color:var(--graphite);font-size:13px}
.filedrawer{position:sticky;top:24px}
.filedrawer header{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.filedrawer header h2{font:650 14px var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filedrawer .link{border:0;background:none;color:var(--mute);font-weight:600}
.filedrawer .big{aspect-ratio:4/5;margin:12px 16px;border-radius:10px}
.filedrawer dl{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:0 16px;font-size:13px}
.filedrawer dt{color:var(--mute)}.filedrawer dd{margin:0}
.filedrawer dd .pf{vertical-align:-3px;margin-right:4px}
.filedrawer .dacts{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 16px}
@media (max-width:1280px){.lib{grid-template-columns:200px minmax(0,1fr)}.filedrawer{display:none}}
@media (max-width:760px){.lib{grid-template-columns:1fr}.libnav{position:static;flex-direction:row;overflow-x:auto}.libsep,.libnav .newf{display:none}.libnav button{white-space:nowrap}}

/* ---------- placeholder ---------- */
.ph-view{display:grid;place-items:center;min-height:50vh;color:var(--mute);text-align:center}
.ph-view h2{font:650 20px var(--display);color:var(--graphite);margin:0 0 6px}

.ov>*,.cr>*,.panel{min-width:0}
.post .who{min-width:0}
.slot>*{min-width:0}
.post .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.post .who b .pf{vertical-align:-3px;margin-right:6px}
@media (max-width:1100px){.ov,.cr{grid-template-columns:1fr}.prev{position:static}.recent{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 96px}
  .top h1{font-size:24px}
  .top{flex-wrap:wrap;align-items:flex-start}
  .slot,.now{grid-template-columns:44px 18px 1fr}
  .post{gap:9px;padding:6px}
  .post img,.post .ph{width:32px;height:40px}
  .status{font-size:11px;padding:2px 7px}
  .recent{grid-template-columns:repeat(2,1fr)}
  .tabbar{display:flex}
  .dock{flex-wrap:wrap;bottom:70px}
}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:8px 6px 14px;z-index:5}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);text-decoration:none}
.tabbar a svg{width:20px;height:20px}
.tabbar a.on{color:var(--graphite)}
.tabbar .plus{width:44px;height:44px;border-radius:14px;background:var(--saffron);color:#1C2230;display:grid;place-items:center;margin-top:-18px}
.mock-flag{position:fixed;left:14px;bottom:14px;background:var(--graphite);color:var(--surface);font-size:12px;border-radius:20px;padding:6px 12px;opacity:.85;z-index:9}

const ico = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

function shell(v) {

  document.querySelector('.side nav:last-of-type').innerHTML = `<a href="#settings" class="${v === 'settings' ? 'on' : ''}">${ico('gear')}Settings</a>`;
  document.getElementById('tabbar').innerHTML = [['overview','Overview','home'],['calendar','Calendar','cal']].map(([k,l,i]) =>

let perfTab = 0;
// Daily views per platform for the last 7 days (sample).
function chart() {
  const days = ['Thu','Fri','Sat','Sun','Mon','Tue','Wed'];
  const data = perfTab === 2
    ? [[12,18,9],[20,26,11],[8,30,6],[14,22,9],[25,41,12],[19,33,10],[22,38,14]]
    : perfTab === 1
    ? [[310,420,120],[380,510,90],[260,640,70],[290,480,110],[520,760,160],[430,690,140],[470,720,180]]
    : [[2.1,2.8,0.7],[2.6,3.4,0.9],[1.9,4.1,0.6],[2.2,3.2,0.8],[3.4,4.9,1.3],[2.9,4.4,1.1],[3.1,4.6,1.4]];
  const max = Math.max(...data.map(d => d[0] + d[1] + d[2]));
  const colors = ['#1C2230', '#E1306C', '#0866FF'];
  return `<div class="bars">${data.map((d, i) => `<div class="col ${i===6?'today':''}"><div class="stackv">${d.map((v, k) =>
      `<i style="height:${(v / max) * 150}px;background:${colors[k]}" title="${['TikTok','Instagram','Facebook'][k]}"></i>`).join('')}</div><span>${days[i]}</span></div>`).join('')}</div>
    <div class="legend" style="padding:8px 0 0"><span><i style="background:#1C2230"></i>TikTok</span><span><i style="background:#E1306C"></i>Instagram</span><span><i style="background:#0866FF"></i>Facebook</span></div>`;
}

  <div class="dock">
    <div class="seg">${[['now','Post now'],['queue','Next free slot'],['pick','Pick a time']].map(([k, l]) => `<button class="${when === k ? 'on' : ''}" data-when="${k}">${l}</button>`).join('')}</div>
    <span class="when">${when === 'queue' ? 'Instagram <b>Wed 18:00</b> · Facebook <b>Wed 18:00</b> · TikTok <b>Thu 09:00</b>' : when === 'now' ? 'Goes out <b>right away</b>' : '<b>Choose a date and time</b>'}</span>
    <span class="sp"></span>
    <button class="btn">Save draft</button>
    <button class="btn primary">${when === 'now' ? 'Post to 3 accounts' : 'Schedule 3 posts'}</button>
  </div>`;
}

// ---------- library ----------
let libFolder = 'all', libSel = new Set([2, 5]), libOpen = 5;
const FILES = Array.from({ length: 18 }, (_, n) => ({
  n, name: ['jordan-4-bred','sourdough-crust','morning-desk','yeezy-zebra','phone-lock','bakery-front','golf-set','laptop-plan',
           'grails-drop-02','croissant','focus-timer','dunk-panda','coffee-notes','shoe-box','city-run','bread-slices','planner-pages','nb-550'][n] + '.jpg',
  folder: [0,3,8,11,13,17].includes(n) ? 'grails' : [1,5,9,15].includes(n) ? 'bakery' : 'arco',
  used: [0,1,3,5,8].includes(n) ? (n % 2 ? 1 : 2) : 0, size: (1.1 + (n % 5) * 0.4).toFixed(1),
}));
function library() {
  const shown = FILES.filter(f => libFolder === 'all' || (libFolder === 'unused' ? !f.used : f.folder === libFolder));
  const f = libOpen == null ? null : FILES[libOpen];
  return `
  <div class="top"><div><h1>Library</h1><p><b>148 files</b>, 1.2 GB of 2 GB used</p></div>
    <button class="btn primary">${ico('upload',16)}Upload files</button></div>
  <div class="lib">
    <aside class="panel libnav">${[['all','All files',148],['unused','Not used yet',61]].map(([k,l,c]) =>
      `<button class="${libFolder===k?'on':''}" data-lf="${k}">${l}<span>${c}</span></button>`).join('')}
      <div class="libsep">Folders</div>
      ${[['grails','Grails drops',52],['bakery','Bakery',31],['arco','ARCO app',65]].map(([k,l,c]) =>
      `<button class="${libFolder===k?'on':''}" data-lf="${k}">${ico('folder',16)}${l}<span>${c}</span></button>`).join('')}
      <button class="newf">${ico('plus',14)} New folder</button></aside>
    <section class="panel libmain">
      <div class="libbar"><label class="srch">${ico('search',16)}<input placeholder="Search files"></label>
        <select><option>All brands</option><option>Grails_Store</option><option>ARCO</option></select>
        <select><option>Photos and videos</option><option>Photos</option><option>Videos</option></select>
        <select><option>Newest first</option><option>Oldest first</option><option>Name</option></select></div>
      ${libSel.size ? `<div class="selbar"><b>${libSel.size} selected</b><button class="btn primary">${ico('edit',16)}Use in new post</button>
        <button class="btn">${ico('folder',16)}Move to folder</button><button class="btn danger">Delete</button>
        <button class="link" data-clear>Clear</button></div>` : ''}
      <div class="grid">${shown.map(x => `<div class="tile ${libSel.has(x.n)?'sel':''} ${libOpen===x.n?'open':''}" data-file="${x.n}">
          <div class="thumb" style="background:${G[x.n % G.length]}"><button class="pick" data-pick="${x.n}" aria-label="Select">${libSel.has(x.n)?ico('check',14):''}</button>
          ${x.used ? `<span class="used">Used ${x.used}×</span>` : ''}</div>
          <span class="fname">${x.name}</span></div>`).join('')}
        <div class="drop">${ico('upload',22)}<b>Drop files to upload</b><span>JPG, PNG, HEIC up to 20 MB each</span></div></div>
    </section>
    ${f ? `<aside class="panel filedrawer"><header><h2>${f.name}</h2><button class="link" data-close>Close</button></header>
      <div class="big" style="background:${G[f.n % G.length]}"></div>
      <dl><dt>Size</dt><dd>${f.size} MB, 1080 × 1350</dd><dt>Folder</dt><dd>${{grails:'Grails drops',bakery:'Bakery',arco:'ARCO app'}[f.folder]}</dd>
        <dt>Uploaded</dt><dd>Oct 12 by Thinh</dd>
        <dt>Posted</dt><dd>${f.used ? `${pf('facebook')} Grails_Store, Oct 13${f.used > 1 ? `<br>${pf('instagram')} @get.arco, Oct 14` : ''}` : 'Not used yet'}</dd></dl>
      <div class="dacts"><button class="btn primary">Use in new post</button><button class="btn">Rename</button><button class="btn">Download</button><button class="btn danger">Delete</button></div>
    </aside>` : ''}
  </div>`;
}

function placeholder(v) {
  const t = { calendar:'Calendar', drafts:'Drafts', accounts:'Accounts', settings:'Settings' }[v];
  return `<div class="top"><div><h1>${t}</h1></div></div><div class="panel ph-view"><div><h2>${t} comes in a later phase</h2>
    <p>This mockup covers the menu, Overview and Create.<br>Try Overview and Create from the menu.</p></div></div>`;
}

function render() {
  const v = (location.hash || '#overview').slice(1);
  shell(v);
  document.getElementById('main').innerHTML = v === 'overview' ? overview() : v === 'create' ? create() : v === 'library' ? library() : placeholder(v);
  document.querySelectorAll('[data-lf]').forEach(b => b.onclick = () => { libFolder = b.dataset.lf; render(); });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = e => { e.stopPropagation(); const n = +b.dataset.pick; libSel.has(n) ? libSel.delete(n) : libSel.add(n); render(); });
  document.querySelectorAll('[data-file]').forEach(b => b.onclick = () => { libOpen = +b.dataset.file; render(); });
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { libSel.clear(); render(); });
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { libOpen = null; render(); });
  document.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { cTab = b.dataset.ctab; render(); });
  document.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => { pTab = b.dataset.ptab; render(); });
  document.querySelectorAll('[data-when]').forEach(b => b.onclick = () => { when = b.dataset.when; render(); });
  document.querySelectorAll('[data-perf]').forEach(b => b.onclick = () => { perfTab = +b.dataset.perf; render(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
