name = "arco-publisher-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_ORIGIN = "https://arco-publisher.vercel.app"
REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/callback"
META_REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/meta/callback"
IG_REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/instagram/callback"
# Secrets (npx wrangler secret put NAME): META_APP_ID, META_APP_SECRET for
# Facebook Pages; IG_APP_ID, IG_APP_SECRET (the Instagram app id/secret from
# the app's Instagram > API setup with Instagram login) for Instagram.

[[d1_databases]]
binding = "DB"
database_name = "arco-publisher"
database_id = "01e34a3d-9c75-427b-9709-3dc6dd89d8ef"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "arco-publisher-media"

# Every minute: publish what is due, poll what is publishing, clean up.
[triggers]
crons = ["* * * * *"]
