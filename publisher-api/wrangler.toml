name = "arco-publisher-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The database lives in Asia-Pacific and each request makes several lookups in
# a row. Smart Placement runs the Worker next to it, so a request crosses the
# distance once instead of once per lookup.
[placement]
mode = "smart"

[vars]
PUBLIC_ORIGIN = "https://arco-publisher.vercel.app"
# Where the page uploads videos directly (they skip the site's proxy).
API_ORIGIN = "https://arco-publisher-api.thinht7110.workers.dev"
REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/callback"
META_REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/meta/callback"
IG_REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/instagram/callback"
YT_REDIRECT_URI = "https://arco-publisher.vercel.app/api/auth/youtube/callback"
# Secrets (npx wrangler secret put NAME): META_APP_ID, META_APP_SECRET for
# Facebook Pages; IG_APP_ID, IG_APP_SECRET (the Instagram app id/secret from
# the app's Instagram > API setup with Instagram login) for Instagram;
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (a Google Cloud OAuth web client) for YouTube;
# GOOGLE_API_KEY (YouTube Data API key) for competitor channels;
# ANTHROPIC_API_KEY for AI writing;
# RESEND_API_KEY and MAIL_FROM (e.g. "ARCO Publisher <login@your-domain>") for sign-in codes and invites.

[[d1_databases]]
binding = "DB"
database_name = "arco-publisher"
database_id = "01e34a3d-9c75-427b-9709-3dc6dd89d8ef"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "arco-publisher-media"

# Every minute: publish what is due, poll what is publishing, clean up.
[triggers]
crons = ["* * * * *"]
