<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Connect your AI — ARCO</title>
<link rel="icon" type="image/png" href="icon.png">
<script>
  // Apple's iCloud sign-in lands here (its redirect is always https) and the
  // token is handed straight to `arco login`, listening on this computer.
  // Nothing is stored or sent anywhere else, and the page loads no other scripts.
  (function () {
    var token = new URLSearchParams(location.search).get("ckWebAuthToken");
    if (!token) return;
    history.replaceState(null, "", location.pathname);
    location.replace("http://127.0.0.1:8765/callback?ckWebAuthToken=" + encodeURIComponent(token));
  })();
</script>
<style>
  :root { color-scheme: dark; --amber:#FFD60A; --bg:#0A0A0B; --card:#101012; --line:rgba(255,255,255,.09); --fg:#F2F0EB; --muted:#8E8E93; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:560px; margin:0 auto; padding:96px 24px; }
  img { width:56px; height:56px; border-radius:13px; margin-bottom:24px; }
  .eyebrow { font-size:11px; font-weight:900; letter-spacing:.24em; text-transform:uppercase; color:var(--amber); margin-bottom:12px; }
  h1 { font-size:32px; font-weight:900; letter-spacing:-1px; margin-bottom:12px; }
  p { color:#c9c9cd; font-size:15px; }
  p + p { margin-top:10px; }
  code { background:var(--card); box-shadow:inset 0 0 0 1px var(--line); border-radius:6px; padding:2px 7px; font-size:14px; color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="ARCO">
  <div class="eyebrow">Connect your AI</div>
  <h1>Finishing sign-in…</h1>
  <p>This page passes your iCloud sign-in to <code>arco login</code> on this computer.</p>
  <p>If you see an error instead of “ARCO is connected”, run <code>arco login</code> in a terminal and sign in again.</p>
</div>
</body>
</html>
